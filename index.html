<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Cost Calculator</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>☁️ Cloud Cost Calculator</h1>
        <p>Estimate your monthly AWS EC2 costs in seconds.</p>
    </header>

    <main class="calculator">

        <section class="form-card">

            <h2>Configuration</h2>

            <label>AWS Region</label>

            <select id="region">
                <option>US East (N. Virginia)</option>
                <option>EU (Frankfurt)</option>
                <option>EU (Ireland)</option>
                <option>Asia Pacific (Singapore)</option>
            </select>

            <label>EC2 Instance Type</label>

            <select id="instance">
                <option>t2.micro</option>
                <option>t3.micro</option>
                <option>t3.small</option>
                <option>t3.medium</option>
                <option>m5.large</option>
            </select>

            <label>Number of Instances</label>

            <input
                type="number"
                id="instances"
                value="1"
                min="1">

            <label>Running Hours</label>

            <input
                type="number"
                id="hours"
                value="720">

            <button id="calculateBtn">
                Calculate Cost
            </button>

        </section>

        <section class="result-card">

            <h2>Estimated Cost</h2>

            <div class="result">

                <span>Monthly</span>

                <h3 id="monthlyCost">$0.00</h3>

            </div>

            <div class="result">

                <span>Yearly</span>

                <h3 id="yearlyCost">$0.00</h3>

            </div>

            <hr>

            <h4>Summary</h4>

            <ul>

                <li>Region:
                    <strong id="summaryRegion">
                        US East
                    </strong>
                </li>

                <li>Instance:
                    <strong id="summaryInstance">
                        t2.micro
                    </strong>
                </li>

                <li>Instances:
                    <strong id="summaryCount">
                        1
                    </strong>
                </li>

                <li>Hours:
                    <strong id="summaryHours">
                        720
                    </strong>
                </li>

            </ul>

        </section>

    </main>

</div>

<script src="assets/js/script.js"></script>

</body>
</html>
