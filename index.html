<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple cloud infrastructure cost calculator">
    <title>Cloud Cost Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator-container">

        <header>
            <h1>☁️ Cloud Cost Calculator</h1>
            <p>Estimate your cloud infrastructure costs quickly and easily.</p>
        </header>

        <section class="calculator">

            <div class="input-group">
                <label for="instances">Number of Instances</label>
                <input
                    type="number"
                    id="instances"
                    min="1"
                    value="1"
                >
            </div>

            <div class="input-group">
                <label for="hourlyCost">Hourly Cost ($)</label>
                <input
                    type="number"
                    id="hourlyCost"
                    min="0"
                    step="0.0001"
                    placeholder="Example: 0.0116"
                >
            </div>

            <div class="input-group">
                <label for="hours">Hours per Day</label>
                <input
                    type="number"
                    id="hours"
                    min="1"
                    max="24"
                    value="8"
                >
            </div>

            <button id="calculateBtn">
                Calculate Cost
            </button>

            <section class="results">
                <h2>Estimated Cost</h2>

                <div class="result-item">
                    <span>Daily Cost</span>
                    <strong id="dailyCost">$0.00</strong>
                </div>

                <div class="result-item">
                    <span>Monthly Cost</span>
                    <strong id="monthlyCost">$0.00</strong>
                </div>

                <div class="result-item">
                    <span>Yearly Cost</span>
                    <strong id="yearlyCost">$0.00</strong>
                </div>

            </section>

        </section>

        <footer>
            <p>Built as a hands-on cloud learning project 🚀</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
